<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">PROJET — ZAKARIA BAIT</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cursor.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: 'Satoshi', -apple-system, sans-serif;
      font-size: 13.5px;
      line-height: 1.35;
      padding: 1.5vw 2vw 6vw 2vw;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Navigation supérieure rigoureusement identique à work.html et info.html */
    .top-nav {
      font-family: 'Monument Extended', -apple-system, sans-serif;
      font-weight: 800;
      font-size: clamp(1.1rem, 2.8vw, 2.5rem);
      line-height: 1;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      padding-bottom: 1.2rem;
      border-bottom: 1.5px solid #000000;
      margin-bottom: 2rem;
      user-select: none;
    }

    .top-nav a {
      color: #000000;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    /* Boutons uniformisés brutalistes (Bords droits 0px, bordure fine 1px, Satoshi Light) */
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem 0.6rem;
      border: 1px solid #000000;
      border-radius: 0px;
      font-family: 'Satoshi', sans-serif !important;
      font-weight: 300 !important;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      background: transparent;
      color: #000000;
      text-decoration: none !important;
      cursor: pointer;
      text-transform: uppercase;
    }

    .nav-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .nav-btn.active {
      background: #000000;
      color: #ffffff;
      pointer-events: none;
    }

    /* En-tête éditorial du projet */
    .project-header {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 3rem;
      margin-bottom: 3.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #000000;
    }

    .project-title {
      font-family: 'Monument Extended', -apple-system, sans-serif;
      font-weight: 800;
      font-size: clamp(1.8rem, 3.8vw, 3.8rem);
      line-height: 0.95;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      letter-spacing: -0.01em;
    }

    .project-subtitle {
      font-family: 'Satoshi', sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.45;
      max-width: 650px;
      color: #111111;
    }

    .project-meta {
      font-family: 'Satoshi', sans-serif;
      font-size: 12.5px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .meta-group b {
      font-family: 'Monument Extended', -apple-system, sans-serif;
      font-weight: 800;
      display: block;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.06em;
      margin-bottom: 0.25rem;
      color: #000000;
    }

    .meta-group span {
      font-family: 'Satoshi', sans-serif;
      font-weight: 300;
      color: #222222;
    }

    /* Flux de médias avec gouttières serrées Cargo brutalistes */
    .project-media-flow {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .media-full {
      width: 100%;
    }

    .media-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .media-grid-asym {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 0.5rem;
      align-items: center;
    }

    figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .project-media {
      width: 100%;
      height: auto;
      background: #f7f7f7;
      min-height: 380px;
      object-fit: cover;
      display: block;
      border-radius: 0px;
    }

    figcaption {
      margin-top: 0.45rem;
      font-family: 'Satoshi', sans-serif;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.02em;
      color: #111111;
      opacity: 0.9;
    }

    .project-narrative {
      font-family: 'Satoshi', sans-serif;
      font-size: 14.5px;
      line-height: 1.55;
      max-width: 820px;
      margin: 1.5rem 0;
      font-weight: 400;
      color: #111111;
    }

    /* Navigation entre projets en bas de page */
    .project-footer-nav {
      margin-top: 5rem;
      padding-top: 1.8rem;
      border-top: 1.5px solid #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Responsive mobile */
    @media (max-width: 820px) {
      body {
        padding: 5vw 4vw;
      }
      .top-nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .project-header {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .media-grid-2, .media-grid-asym {
        grid-template-columns: 1fr;
      }
      .project-media {
        min-height: 240px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation principale avec boutons Work / About / Mail -->
  <nav class="top-nav">
    <a href="index.html">ZAKARIA BAIT</a>
    <div class="nav-links">
      <a href="work.html" class="nav-btn active">WORK</a>
      <a href="info.html" class="nav-btn">INFO</a>
      <a href="mailto:zakaria-bait@outlook.com" class="nav-btn">MAIL</a>
    </div>
  </nav>

  <!-- En-tête éditorial du projet -->
  <header class="project-header">
    <div>
      <h1 class="project-title" id="proj-title">Projet</h1>
      <p class="project-subtitle" id="proj-subtitle">
        Direction Artistique &amp; Exploration Graphique
      </p>
    </div>
    
    <div class="project-meta">
      <div class="meta-group">
        <b>Discipline</b>
        <span id="proj-discipline">Direction Artistique, Design</span>
      </div>
      <div class="meta-group">
        <b>Année</b>
        <span id="proj-year">2026</span>
      </div>
      <div class="meta-group">
        <b>Client / Contexte</b>
        <span id="proj-client">Marrakech — Studio</span>
      </div>
    </div>
  </header>

  <!-- Flux d'images et blocs modulaires de la page projet -->
  <main class="project-media-flow" id="proj-flow">
    <!-- Généré dynamiquement en JS -->
  </main>

  <!-- Navigation de bas de page vers d'autres projets -->
  <footer class="project-footer-nav">
    <a href="work.html" class="nav-btn">← TOUS LES PROJETS</a>
    <a href="work.html" id="next-proj-link" class="nav-btn">PROJET SUIVANT →</a>
  </footer>

  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Récupération des données (Priorité au brouillon CMS en direct dans localStorage)
      let data = window.PORTFOLIO_DATA || { projects: [], categories: [] };
      try {
        const draft = localStorage.getItem('portfolio_cms_draft');
        if (draft) {
          const parsed = JSON.parse(draft);
          if (parsed && Array.isArray(parsed.projects) && parsed.projects.length > 0) {
            data = parsed;
          }
        }
      } catch (e) {}

      if (!data || !data.projects) {
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const projId = params.get('id');

      const projects = (data.projects || []).filter(p => p.type !== 'text');
      let currentIndex = projects.findIndex(p => p.id === projId);
      
      // Si l'ID demandé n'est pas trouvé dans la liste
      if (currentIndex === -1) {
        if (projId) {
          // Nouveau projet en cours de création
          const tempProj = {
            id: projId,
            title: "Nouveau Projet",
            subtitle: "Page détaillée du projet",
            year: "2026",
            client: "Marrakech — Studio",
            category: "direction",
            detail: {
              title: "Nouveau Projet",
              subtitle: "Page détaillée en cours de composition",
              blocks: []
            }
          };
          projects.unshift(tempProj);
          currentIndex = 0;
        } else {
          currentIndex = 0;
        }
      }

      const project = projects[currentIndex];
      if (!project) return;

      const detail = project.detail || {};

      // Catégorie lisible
      const catObj = (data.categories || []).find(c => c.id === project.category);
      const catLabel = catObj ? catObj.label : (project.category || 'Direction Artistique');

      // Titres & Métadonnées
      const rawTitle = (detail.title || project.title || 'PROJET').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
      document.getElementById('page-title').textContent = `${rawTitle} — ZAKARIA BAIT`;
      document.getElementById('proj-title').innerHTML = detail.title || project.title || 'Projet';
      
      document.getElementById('proj-subtitle').innerHTML = detail.subtitle || project.subtitle || rawTitle;
      document.getElementById('proj-discipline').textContent = detail.discipline || catLabel;
      document.getElementById('proj-year').textContent = detail.year || project.year || '2026';
      document.getElementById('proj-client').textContent = detail.client || project.client || 'Marrakech — Studio';

      // Rendu du flux modulaire (Media Flow)
      const flow = document.getElementById('proj-flow');
      flow.innerHTML = '';

      // SI LE PROJET CONTIENT DES BLOCS MODULAIRES ÉDITÉS DANS LE CMS
      if (Array.isArray(detail.blocks) && detail.blocks.length > 0) {
        detail.blocks.forEach((block, idx) => {
          if (block.type === 'full-media') {
            flow.appendChild(createFullMediaElement(block, idx));
          } else if (block.type === 'narrative') {
            const div = document.createElement('div');
            div.className = 'project-narrative';
            div.innerHTML = block.text || '';
            flow.appendChild(div);
          } else if (block.type === 'grid-2') {
            flow.appendChild(createGridElement(block, 'media-grid-2'));
          } else if (block.type === 'grid-asym') {
            flow.appendChild(createGridElement(block, 'media-grid-asym'));
          }
        });
      } else {
        // MODE PAR DÉFAUT (Si le projet n'a pas encore de blocs personnalisés)
        const mainMedia = project.media || project.image || '';
        const isVideo = project.type === 'video';

        const heroFig = document.createElement('figure');
        heroFig.className = 'media-full';
        heroFig.innerHTML = renderMediaHtml(mainMedia, isVideo, rawTitle, '01 &nbsp; &nbsp; ' + rawTitle);
        flow.appendChild(heroFig);

        const narrativeText = project.narrative || project.textContent || `Le projet <b>${rawTitle}</b> explore la stratégie visuelle et l'identité de marque à travers un langage graphique singulier et précis, articulé autour de la composition et du contraste typographique.`;
        const narrativeDiv = document.createElement('div');
        narrativeDiv.className = 'project-narrative';
        narrativeDiv.innerHTML = narrativeText;
        flow.appendChild(narrativeDiv);

        if (Array.isArray(project.gallery) && project.gallery.length > 0) {
          const grid2 = document.createElement('div');
          grid2.className = 'media-grid-2';
          project.gallery.forEach((gMedia, gIdx) => {
            grid2.innerHTML += `
              <figure>
                <img src="${gMedia}" class="project-media" alt="Détail ${gIdx + 2}">
                <figcaption>0${gIdx + 2} &nbsp; &nbsp; Étude visuelle et déclinaison</figcaption>
              </figure>
            `;
          });
          flow.appendChild(grid2);
        }
      }

      // Lien Projet Suivant
      const nextIndex = (currentIndex + 1) % projects.length;
      const nextProj = projects[nextIndex];
      const nextBtn = document.getElementById('next-proj-link');
      if (nextProj) {
        nextBtn.href = `project-detail.html?id=${nextProj.id}`;
        const nextTitleClean = (nextProj.title || nextProj.id).replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
        nextBtn.textContent = `PROJET SUIVANT →`;
      }
    });

    // Fonctions d'aide pour générer les blocs HTML
    function renderMediaHtml(src, isVideo, alt, caption) {
      const isVid = isVideo || (typeof src === 'string' && src.match(/\.(mp4|webm|mov)$/i));
      let mediaTag = '';
      if (isVid) {
        mediaTag = src 
          ? `<video src="${src}" autoplay loop muted playsinline class="project-media"></video>`
          : `<div class="project-media" style="min-height:450px; display:flex; align-items:center; justify-content:center; color:#888; font-weight:700;">VIDÉO PRINCIPALE</div>`;
      } else {
        mediaTag = src 
          ? `<img src="${src}" class="project-media" alt="${alt || ''}">`
          : `<div class="project-media" style="min-height:450px; display:flex; align-items:center; justify-content:center; color:#888; font-weight:700;">IMAGE / VISUEL</div>`;
      }
      return `${mediaTag}${caption ? `<figcaption>${caption}</figcaption>` : ''}`;
    }

    function createFullMediaElement(block, idx) {
      const fig = document.createElement('figure');
      fig.className = 'media-full';
      fig.innerHTML = renderMediaHtml(block.media, block.mediaType === 'video', 'Visuel', block.caption);
      return fig;
    }

    function createGridElement(block, gridClass) {
      const div = document.createElement('div');
      div.className = gridClass;
      div.innerHTML = `
        <figure>
          ${renderMediaHtml(block.media1, block.media1Type === 'video', 'Détail 1', block.caption1)}
        </figure>
        <figure>
          ${renderMediaHtml(block.media2, block.media2Type === 'video', 'Détail 2', block.caption2)}
        </figure>
      `;
      return div;
    }
  </script>
  <!-- GSAP & Clean Cursor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="cursor.js"></script>
</body>
</html>
