<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">PROJET — ZAKARIA BAIT</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cursor.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: 'Satoshi', -apple-system, sans-serif;
      font-size: 13.5px;
      line-height: 1.35;
      padding: 1.5vw 2vw 6vw 2vw;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Navigation supérieure rigoureusement identique à work.html et info.html */
    .top-nav {
      font-family: 'Satoshi', -apple-system, sans-serif;
      font-weight: 700;
      font-size: clamp(1.1rem, 2.8vw, 2.5rem);
      line-height: 1;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      padding-bottom: 1.2rem;
      border-bottom: 1.5px solid #000000;
      margin-bottom: 2rem;
      user-select: none;
    }

    .top-nav a {
      color: #000000;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    /* Boutons uniformisés brutalistes (Bords droits 0px, bordure fine 1px, Satoshi Light) */
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem 0.6rem;
      border: 1px solid #000000;
      border-radius: 0px;
      font-family: 'Satoshi', sans-serif !important;
      font-weight: 300 !important;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      background: transparent;
      color: #000000;
      text-decoration: none !important;
      cursor: pointer;
      text-transform: uppercase;
    }

    .nav-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .nav-btn.active {
      background: #000000;
      color: #ffffff;
      pointer-events: none;
    }

    /* ========================================================
       MISE EN PAGE ÉDITORIALE TRABUC.CO STYLE (CARGO / MUSEUM)
       ======================================================== */

    /* En-tête éditorial en 2 colonnes 50/50 */
    .trabuc-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4.5vw;
      margin-bottom: 4rem;
      padding-bottom: 2.5rem;
      border-bottom: 1.5px solid #000000;
    }

    .trabuc-header-left {
      display: flex;
      flex-direction: column;
    }

    .trabuc-title {
      font-family: 'Satoshi', -apple-system, sans-serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 4.2vw, 4.2rem);
      line-height: 1.0;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      color: #000000;
    }

    .trabuc-tagline {
      font-family: 'Satoshi', sans-serif;
      font-size: clamp(14px, 1.2vw, 16px);
      font-weight: 400;
      line-height: 1.45;
      color: #444444;
      max-width: 92%;
    }

    .trabuc-header-right {
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
      font-family: 'Satoshi', sans-serif;
      font-size: 13.5px;
      line-height: 1.55;
      color: #222222;
    }

    .trabuc-section-title {
      display: block;
      font-weight: 700;
      color: #000000;
      font-size: 13.5px;
      margin-bottom: 0.35rem;
      letter-spacing: 0.02em;
    }

    .trabuc-section-body {
      font-family: 'Satoshi', sans-serif;
      font-size: 13.5px;
      line-height: 1.55;
      color: #222222;
    }

    .trabuc-section-body b {
      font-weight: 700;
      color: #000000;
    }

    /* Table Métadonnées avec pointillés dynamiques (Style Trabuc Mono) */
    .trabuc-meta-table {
      margin-top: 0.8rem;
      padding-top: 1.2rem;
      border-top: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      font-family: 'Satoshi', monospace, sans-serif;
      font-size: 12px;
    }

    .trabuc-meta-row {
      display: flex;
      align-items: baseline;
      width: 100%;
    }

    .trabuc-meta-label {
      font-weight: 600;
      color: #000000;
      white-space: nowrap;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .trabuc-meta-dots {
      flex: 1;
      margin: 0 0.5rem;
      border-bottom: 1px dotted #888888;
      position: relative;
      top: -3px;
    }

    .trabuc-meta-val {
      color: #333333;
      white-space: nowrap;
      font-weight: 400;
      font-size: 12px;
    }

    .trabuc-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.2rem;
    }

    .trabuc-link {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid #000000;
      padding-bottom: 2px;
      color: #000000;
      transition: opacity 0.2s;
    }

    .trabuc-link:hover {
      opacity: 0.6;
    }

    .trabuc-link::after {
      content: '↗';
      display: inline-block;
      font-size: 11px;
      transition: transform 0.2s ease;
    }

    .trabuc-link:hover::after {
      transform: translate(2px, -2px);
    }

    /* Flux de médias modulaire Trabuc */
    .project-media-flow {
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
    }

    figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .project-media {
      width: 100%;
      height: auto;
      background: #f7f7f7;
      min-height: 280px;
      object-fit: cover;
      display: block;
      border-radius: 0px;
    }

    figcaption {
      margin-top: 0.55rem;
      font-family: 'Satoshi', sans-serif;
      font-size: 11.5px;
      font-weight: 300;
      letter-spacing: 0.02em;
      color: #333333;
    }

    /* 1. Grand média héro 100% */
    .media-full {
      width: 100%;
    }

    /* 2. Duo Éditorial Trabuc (Image + Texte H2 & Récit) */
    .trabuc-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5vw;
      align-items: center;
      margin: 1.5rem 0;
    }

    .trabuc-duo.reversed {
      direction: rtl;
    }

    .trabuc-duo.reversed > * {
      direction: ltr;
    }

    .trabuc-duo-media {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .trabuc-duo-text h2 {
      font-family: 'Satoshi', sans-serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 2.2vw, 2rem);
      line-height: 1.1;
      letter-spacing: -0.015em;
      margin-bottom: 1.1rem;
      color: #000000;
    }

    .trabuc-duo-text p {
      font-family: 'Satoshi', sans-serif;
      font-size: 14.5px;
      line-height: 1.55;
      color: #222222;
      margin-bottom: 1rem;
    }

    .trabuc-duo-text p b {
      font-weight: 700;
      color: #000000;
    }

    /* 3. Duo d'images 50/50 */
    .media-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    /* 4. Duo asymétrique 1.4:1 */
    .media-grid-asym {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 0.8rem;
      align-items: center;
    }

    /* 5. Encart Typographique Asymétrique (Style Trabuc 5/7 cols) */
    .trabuc-offset {
      display: grid;
      grid-template-columns: 5fr 7fr;
      gap: 3.5vw;
      margin: 2rem 0;
      padding: 2.5rem 0;
      border-top: 1px solid #000000;
      border-bottom: 1px solid #e0e0e0;
    }

    .trabuc-offset h2 {
      font-family: 'Satoshi', sans-serif;
      font-weight: 700;
      font-size: clamp(1.5rem, 2.5vw, 2.3rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #000000;
      margin-bottom: 0.8rem;
    }

    .trabuc-offset p {
      font-family: 'Satoshi', sans-serif;
      font-size: 14.5px;
      line-height: 1.55;
      color: #222222;
    }

    .trabuc-offset p b {
      font-weight: 700;
      color: #000000;
    }

    /* Récit libre */
    .project-narrative {
      font-family: 'Satoshi', sans-serif;
      font-size: 14.5px;
      line-height: 1.55;
      max-width: 820px;
      margin: 1.5rem 0;
      font-weight: 400;
      color: #111111;
    }

    .project-narrative b {
      font-weight: 700;
      color: #000000;
    }

    /* Navigation entre projets en bas de page */
    .project-footer-nav {
      margin-top: 5rem;
      padding-top: 1.8rem;
      border-top: 1.5px solid #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Responsive mobile */
    @media (max-width: 820px) {
      body {
        padding: 5vw 4vw;
      }
      .trabuc-header {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .trabuc-duo {
        grid-template-columns: 1fr;
        direction: ltr !important;
        gap: 2rem;
      }
      .trabuc-offset {
        grid-template-columns: 1fr;
        gap: 1.2rem;
      }
      .media-grid-2, .media-grid-asym {
        grid-template-columns: 1fr;
      }
      .project-media {
        min-height: 240px;
      }
    /* ========================================================
       CASE STUDY BESPOQUE : GLYPHS / TRABUC (POUR PROJ_016)
       ======================================================== */
    :root {
      --cs-green: #22c55e;
      --cs-green-subtle: rgba(34, 197, 94, 0.15);
      --cs-dark: #09090b;
      --cs-hairline: #e4e4e7;
      --cs-hairline-dark: #27272a;
      --cs-subtle: #f4f4f5;
      --cs-text-muted: #71717a;
    }

    .glyphs-case-study {
      width: 100%;
      font-family: 'Satoshi', sans-serif;
      color: #09090b;
    }

    .cs-section {
      width: 100%;
      padding: 3.5rem 0;
      border-bottom: 1px solid var(--cs-hairline);
    }

    .cs-section:first-child {
      padding-top: 1rem;
    }

    .cs-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 2rem;
    }

    .cs-tag {
      font-family: 'Satoshi', monospace, sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cs-text-muted);
      font-weight: 500;
      display: block;
      margin-bottom: 0.75rem;
    }

    .cs-title-display {
      font-size: clamp(2.4rem, 5vw, 4.4rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #09090b;
      margin-bottom: 0.4rem;
    }

    .cs-subtitle {
      font-size: clamp(1.15rem, 1.8vw, 1.5rem);
      font-weight: 400;
      color: var(--cs-text-muted);
      line-height: 1.35;
      margin-bottom: 1.5rem;
    }

    .cs-partner-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid var(--cs-hairline);
      background: var(--cs-subtle);
      padding: 0.45rem 0.85rem;
      font-size: 12.5px;
      color: #09090b;
      margin-bottom: 1rem;
    }

    .cs-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cs-green);
      animation: csPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes csPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .cs-ext-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 4px;
      color: #09090b;
      transition: color 0.2s;
    }

    .cs-ext-link:hover {
      color: var(--cs-green);
    }

    .cs-badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .cs-press-badge {
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--cs-hairline);
      font-family: 'Satoshi', monospace, sans-serif;
      font-size: 11.5px;
      text-decoration: none;
      color: #09090b;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .cs-press-badge:hover {
      border-color: var(--cs-green);
      background: var(--cs-subtle);
    }

    .cs-spec-table {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--cs-hairline);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      font-family: 'Satoshi', monospace, sans-serif;
      font-size: 12px;
    }

    .cs-spec-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
    }

    .cs-spec-label {
      color: var(--cs-text-muted);
      white-space: nowrap;
    }

    .cs-spec-dots {
      flex: 1;
      margin: 0 0.5rem;
      border-bottom: 1px dotted var(--cs-hairline);
      position: relative;
      top: -3px;
    }

    .cs-spec-val {
      font-weight: 500;
      color: #09090b;
      text-align: right;
    }

    .cs-dock-wrapper {
      width: 100%;
      border: 1px solid var(--cs-hairline);
      background: var(--cs-subtle);
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .cs-dock {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--cs-hairline);
      padding: 0.6rem 1.1rem;
      border-radius: 1.25rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(8px);
    }

    .cs-dock-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--cs-hairline);
      position: relative;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
    }

    .cs-dock-icon:hover {
      transform: scale(1.12);
    }

    .cs-dock-focal {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: var(--cs-dark);
      border: 2px solid var(--cs-green);
      position: relative;
    }

    .cs-dock-tooltip {
      position: absolute;
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--cs-dark);
      color: #ffffff;
      font-family: 'Satoshi', monospace, sans-serif;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .cs-dock-focal:hover .cs-dock-tooltip {
      opacity: 1;
    }

    .cs-card-subtle {
      border: 1px solid var(--cs-hairline);
      background: var(--cs-subtle);
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cs-card-dark {
      border: 1px solid var(--cs-hairline-dark);
      background: var(--cs-dark);
      color: #ffffff;
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cs-h2 {
      font-size: clamp(1.6rem, 2.8vw, 2.5rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: #09090b;
    }

    .cs-h3 {
      font-size: clamp(1.2rem, 1.8vw, 1.5rem);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .cs-highlight {
      background: var(--cs-green-subtle);
      font-weight: 600;
      padding: 0 0.25rem;
    }

    /* Range slider variable */
    .cs-slider-container {
      margin-top: 1.5rem;
      border: 1px solid var(--cs-hairline);
      padding: 1.5rem;
      background: var(--cs-subtle);
    }

    .cs-slider-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .cs-active-badge {
      padding: 2px 8px;
      background: var(--cs-green);
      color: #09090b;
      font-family: 'Satoshi', monospace, sans-serif;
      font-size: 11px;
      font-weight: 700;
    }

    .cs-range-slider {
      -webkit-appearance: none;
      width: 180px;
      height: 4px;
      background: #d4d4d8;
      outline: none;
      border-radius: 2px;
    }

    .cs-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #09090b;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .cs-range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.3);
      background: var(--cs-green);
    }

    .cs-specimen-scroll {
      overflow-x: auto;
      white-space: nowrap;
      padding: 1rem 0;
      border-top: 1px solid var(--cs-hairline);
    }

    .cs-specimen-text {
      font-size: clamp(1.8rem, 3.5vw, 3rem);
      font-family: 'Satoshi', sans-serif;
      transition: font-weight 0.1s ease;
    }

    /* Stack de répétition typographique posters */
    .cs-typo-stack {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 1.5rem 0;
      user-select: none;
    }

    .cs-typo-stack div {
      font-size: clamp(1.6rem, 2.5vw, 2.2rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    @media (max-width: 820px) {
      .cs-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .cs-grid > [style*="grid-column"] {
        grid-column: span 1 / span 1 !important;
      }
      .cs-dock {
        transform: scale(0.85);
      }
    }
  </style>
</head>
<body>

  <!-- Navigation principale avec boutons Work / About / Mail -->
  <nav class="top-nav">
    <a href="index.html">ZAKARIA BAIT</a>
    <div class="nav-links">
      <a href="work.html" class="nav-btn active">WORK</a>
      <a href="info.html" class="nav-btn">INFO</a>
      <a href="mailto:zakaria-bait@outlook.com" class="nav-btn">MAIL</a>
    </div>
  </nav>

  <!-- En-tête éditorial Trabuc.co Style -->
  <header class="trabuc-header" id="trabuc-standard-header">

    <div class="trabuc-header-left">
      <h1 class="trabuc-title" id="proj-title">Projet</h1>
      <div class="trabuc-tagline" id="proj-subtitle">Direction Artistique &amp; Typographie</div>
    </div>
    
    <!-- Colonne Droite : Récit (Brief, Solution) + Table métadonnées en pointillés + Liens -->
    <div class="trabuc-header-right">
      <div class="trabuc-section" id="sec-brief">
        <span class="trabuc-section-title">Brief</span>
        <div class="trabuc-section-body" id="proj-brief"></div>
      </div>

      <div class="trabuc-section" id="sec-solution">
        <span class="trabuc-section-title">Solution</span>
        <div class="trabuc-section-body" id="proj-solution"></div>
      </div>

      <div class="trabuc-links" id="proj-links"></div>

      <!-- Table Métadonnées avec pointillés dynamiques -->
      <div class="trabuc-meta-table">
        <div class="trabuc-meta-row" id="row-role">
          <span class="trabuc-meta-label">Role</span>
          <span class="trabuc-meta-dots"></span>
          <span class="trabuc-meta-val" id="proj-role">Direction Artistique &amp; Design</span>
        </div>
        <div class="trabuc-meta-row" id="row-field">
          <span class="trabuc-meta-label">Field</span>
          <span class="trabuc-meta-dots"></span>
          <span class="trabuc-meta-val" id="proj-discipline">Branding, 3D, Typographie</span>
        </div>
        <div class="trabuc-meta-row" id="row-client">
          <span class="trabuc-meta-label">Client</span>
          <span class="trabuc-meta-dots"></span>
          <span class="trabuc-meta-val" id="proj-client">Marrakech — Studio</span>
        </div>
        <div class="trabuc-meta-row" id="row-year">
          <span class="trabuc-meta-label">Year</span>
          <span class="trabuc-meta-dots"></span>
          <span class="trabuc-meta-val" id="proj-year">2026</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Flux d'images et blocs modulaires de la page projet -->
  <main class="project-media-flow" id="proj-flow">
    <!-- Généré dynamiquement en JS -->
  </main>

  <!-- Navigation de bas de page vers d'autres projets -->
  <footer class="project-footer-nav">
    <a href="work.html" class="nav-btn">← TOUS LES PROJETS</a>
    <a href="work.html" id="next-proj-link" class="nav-btn">PROJET SUIVANT →</a>
  </footer>

  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Récupération des données (Priorité au brouillon CMS en direct dans localStorage)
      let data = window.PORTFOLIO_DATA || { projects: [], categories: [] };
      try {
        const draft = localStorage.getItem('portfolio_cms_draft');
        if (draft) {
          const parsed = JSON.parse(draft);
          if (parsed && Array.isArray(parsed.projects) && parsed.projects.length > 0) {
            data = parsed;
          }
        }
      } catch (e) {}

      if (!data || !data.projects) {
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const projId = params.get('id');

      const projects = (data.projects || []).filter(p => p.type !== 'text');
      let currentIndex = projects.findIndex(p => p.id === projId);
      
      // Si l'ID demandé n'est pas trouvé dans la liste
      if (currentIndex === -1) {
        if (projId) {
          // Nouveau projet en cours de création
          const tempProj = {
            id: projId,
            title: "Nouveau Projet",
            subtitle: "Page détaillée du projet",
            year: "2026",
            client: "Marrakech — Studio",
            category: "direction",
            detail: {
              title: "Nouveau Projet",
              subtitle: "Page détaillée en cours de composition",
              blocks: []
            }
          };
          projects.unshift(tempProj);
          currentIndex = 0;
        } else {
          currentIndex = 0;
        }
      }

      const project = projects[currentIndex];
      if (!project) return;

      const detail = project.detail || {};

      // SI C'EST LE PROJET 016 (OU TEMPLATE GLYPHS CASE STUDY)
      if (project.id === 'proj_016' || detail.template === 'glyphs-case-study') {
        const stdHeader = document.getElementById('trabuc-standard-header');
        if (stdHeader) stdHeader.style.display = 'none';

        const rawTitle = (detail.title || project.title || 'Glyphs App').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
        document.getElementById('page-title').textContent = `${rawTitle} — ZAKARIA BAIT`;

        const flow = document.getElementById('proj-flow');
        flow.innerHTML = '';
        renderGlyphsCaseStudy(project, flow);

        // Lien Projet Suivant
        const nextIndex = (currentIndex + 1) % projects.length;
        const nextProj = projects[nextIndex];
        const nextBtn = document.getElementById('next-proj-link');
        if (nextProj) {
          nextBtn.href = `project-detail.html?id=${nextProj.id}`;
          nextBtn.textContent = `PROJET SUIVANT →`;
        }
        return;
      }

      // Catégorie lisible
      const catObj = (data.categories || []).find(c => c.id === project.category);
      const catLabel = catObj ? catObj.label : (project.category || 'Direction Artistique');

      // Titres & Métadonnées Trabuc Style
      const rawTitle = (detail.title || project.title || 'PROJET').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
      document.getElementById('page-title').textContent = `${rawTitle} — ZAKARIA BAIT`;
      document.getElementById('proj-title').innerHTML = detail.title || project.title || 'Projet';
      
      document.getElementById('proj-subtitle').innerHTML = detail.subtitle || project.subtitle || "Direction Artistique &amp; Exploration Graphique";
      document.getElementById('proj-role').textContent = detail.role || "Direction Artistique & Design";
      document.getElementById('proj-discipline').textContent = detail.discipline || catLabel;
      document.getElementById('proj-year').textContent = detail.year || project.year || '2026';
      document.getElementById('proj-client').textContent = detail.client || project.client || 'Marrakech — Studio';

      // Brief & Solution
      const briefEl = document.getElementById('proj-brief');
      const solutionEl = document.getElementById('proj-solution');

      if (detail.brief && detail.brief.trim()) {
        briefEl.innerHTML = detail.brief;
      } else if (project.narrative && project.narrative.trim()) {
        briefEl.innerHTML = project.narrative;
      } else {
        briefEl.innerHTML = `Le projet <b>${rawTitle}</b> explore la stratégie de marque et la direction artistique à travers un langage visuel exigeant et singulier, articulé autour du contraste spatial et de la composition typographique.`;
      }

      if (detail.solution && detail.solution.trim()) {
        solutionEl.innerHTML = detail.solution;
      } else if (detail.narrative && detail.narrative.trim()) {
        solutionEl.innerHTML = detail.narrative;
      } else {
        solutionEl.innerHTML = `Conception d’un écosystème modulaire combinant géométrie oblique, hiérarchie typographique forte et contrastes volumétriques pour un impact visuel maximal.`;
      }

      // Liens externes (si configurés)
      const linksContainer = document.getElementById('proj-links');
      if (Array.isArray(detail.links) && detail.links.length > 0) {
        linksContainer.innerHTML = detail.links.map(l => `
          <a href="${l.url}" target="_blank" class="trabuc-link">${l.label || 'Voir le projet'}</a>
        `).join('');
      } else {
        linksContainer.style.display = 'none';
      }

      // Rendu du flux modulaire (Media Flow)
      const flow = document.getElementById('proj-flow');
      flow.innerHTML = '';

      // SI LE PROJET CONTIENT DES BLOCS MODULAIRES ÉDITÉS DANS LE CMS
      if (Array.isArray(detail.blocks) && detail.blocks.length > 0) {
        detail.blocks.forEach((block, idx) => {
          if (block.type === 'full-media') {
            flow.appendChild(createFullMediaElement(block, idx));
          } else if (block.type === 'editorial-duo') {
            flow.appendChild(createEditorialDuoElement(block));
          } else if (block.type === 'offset-narrative') {
            flow.appendChild(createOffsetNarrativeElement(block));
          } else if (block.type === 'narrative') {
            if (block.text && block.text.trim()) {
              const div = document.createElement('div');
              div.className = 'project-narrative';
              div.innerHTML = block.text;
              flow.appendChild(div);
            }
          } else if (block.type === 'grid-2') {
            flow.appendChild(createGridElement(block, 'media-grid-2'));
          } else if (block.type === 'grid-asym') {
            flow.appendChild(createGridElement(block, 'media-grid-asym'));
          }
        });
      } else {
        // MODE PAR DÉFAUT TRABUC (Si le projet n'a pas encore de blocs personnalisés)
        const mainMedia = project.media || project.image || '';
        const isVideo = project.type === 'video';

        const heroFig = document.createElement('figure');
        heroFig.className = 'media-full';
        heroFig.innerHTML = renderMediaHtml(mainMedia, isVideo, rawTitle, '01 / 01 &nbsp; &nbsp; ' + rawTitle);
        flow.appendChild(heroFig);

        const narrativeText = project.narrative || project.textContent || `Le projet <b>${rawTitle}</b> explore la stratégie visuelle et l'identité de marque à travers un langage graphique singulier et précis, articulé autour de la composition et du contraste typographique.`;
        const narrativeDiv = document.createElement('div');
        narrativeDiv.className = 'project-narrative';
        narrativeDiv.innerHTML = narrativeText;
        flow.appendChild(narrativeDiv);

        if (Array.isArray(project.gallery) && project.gallery.length > 0) {
          const grid2 = document.createElement('div');
          grid2.className = 'media-grid-2';
          project.gallery.forEach((gMedia, gIdx) => {
            grid2.innerHTML += `
              <figure>
                <img src="${gMedia}" class="project-media" alt="Détail ${gIdx + 2}">
                <figcaption>0${gIdx + 2} &nbsp; &nbsp; Étude visuelle et déclinaison</figcaption>
              </figure>
            `;
          });
          flow.appendChild(grid2);
        }
      }

      // Lien Projet Suivant
      const nextIndex = (currentIndex + 1) % projects.length;
      const nextProj = projects[nextIndex];
      const nextBtn = document.getElementById('next-proj-link');
      if (nextProj) {
        nextBtn.href = `project-detail.html?id=${nextProj.id}`;
        nextBtn.textContent = `PROJET SUIVANT →`;
      }
    });

    // Fonctions d'aide pour générer les blocs HTML Trabuc Style
    function renderMediaHtml(src, isVideo, alt, caption) {
      const isVid = isVideo || (typeof src === 'string' && src.match(/\.(mp4|webm|mov)$/i));
      let mediaTag = '';
      if (isVid) {
        mediaTag = src 
          ? `<video src="${src}" autoplay loop muted playsinline class="project-media"></video>`
          : `<div class="project-media" style="min-height:380px; display:flex; align-items:center; justify-content:center; color:#888; font-weight:700;">VIDÉO PRINCIPALE</div>`;
      } else {
        mediaTag = src 
          ? `<img src="${src}" class="project-media" alt="${alt || ''}">`
          : `<div class="project-media" style="min-height:380px; display:flex; align-items:center; justify-content:center; color:#888; font-weight:700;">IMAGE / VISUEL</div>`;
      }
      return `${mediaTag}${caption ? `<figcaption>${caption}</figcaption>` : ''}`;
    }

    function createFullMediaElement(block, idx) {
      const fig = document.createElement('figure');
      fig.className = 'media-full';
      fig.innerHTML = renderMediaHtml(block.media, block.mediaType === 'video', 'Visuel', block.caption);
      return fig;
    }

    function createEditorialDuoElement(block) {
      const div = document.createElement('div');
      div.className = `trabuc-duo ${block.reverse ? 'reversed' : ''}`;
      div.innerHTML = `
        <div class="trabuc-duo-media">
          <figure>
            ${renderMediaHtml(block.media, block.mediaType === 'video', block.title, block.caption)}
          </figure>
        </div>
        <div class="trabuc-duo-text">
          ${block.title ? `<h2>${block.title}</h2>` : ''}
          <p>${block.text || ''}</p>
        </div>
      `;
      return div;
    }

    function createOffsetNarrativeElement(block) {
      const div = document.createElement('div');
      div.className = 'trabuc-offset';
      div.innerHTML = `
        <div>
          <h2>${block.title || ''}</h2>
        </div>
        <div>
          <p>${block.text || ''}</p>
        </div>
      `;
      return div;
    }

    function createGridElement(block, gridClass) {
      const div = document.createElement('div');
      div.className = gridClass;
      div.innerHTML = `
        <figure>
          ${renderMediaHtml(block.media1, block.media1Type === 'video', 'Détail 1', block.caption1)}
        </figure>
        <figure>
          ${renderMediaHtml(block.media2, block.media2Type === 'video', 'Détail 2', block.caption2)}
        </figure>
      `;
      return div;
    }

    // ========================================================

                    <a href="${websiteUrl}" target="_blank" rel="noopener noreferrer" class="cs-ext-link">

              <!-- Colonne Droite (7 cols) -->
              <div style="grid-column: span 7 / span 7; display:flex; flex-direction:column; justify-content:space-between; gap:2.5rem;">
                <div style="display:flex; flex-direction:column; gap:1.75rem;">
                  <div>
                    <span class="cs-tag">Brief</span>
                    <p style="font-size:16px; line-height:1.6; color:#09090b;">${brief}</p>
                  </div>

                    <span class="cs-tag">Solution</span>
                    <p style="font-size:14px; line-height:1.6; color:#09090b;">${solution}</p>
                  </div>

                <!-- Press Badges -->
                <div style="padding-top:1.25rem; border-top:1px solid var(--cs-hairline);">
                  <span class="cs-tag">Featured in</span>
                  <div class="cs-badge-group">

                <!-- Spec Table with Dot Leaders -->
                <div class="cs-spec-table">
                  ${specs.map(s => `
                    <div class="cs-spec-row">
                      <span class="cs-spec-label">${s.label}</span>
                      <span class="cs-spec-dots"></span>
                      <span class="cs-spec-val">${s.val}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </section>

          <!-- Section 2: Visual Artifact Bento & Dock Feature -->

            <!-- macOS Dock Preview Panel -->

                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>

                </div>

          <!-- Section 3: Community & Ecosystem -->

                <p style="font-size:11.5px; color:var(--cs-text-muted); margin-top:1rem; margin-bottom:0;">High-impact fluorescent acid-green silkscreen promotional poster series.</p>
              </div>
            </div>
          </section>
        </div>
      `;

      // Slider variable font interactif
      setTimeout(() => {
        const slider = document.getElementById('var-slider');
        const specimen = document.getElementById('var-specimen');
        const label = document.getElementById('var-val-label');
        if (slider && specimen) {
          slider.addEventListener('input', (e) => {
            const val = e.target.value;
            specimen.style.fontWeight = val;
            if (label) label.textContent = val;
          });
        }
      }, 50);
    }
  </script>
  <!-- GSAP & Clean Cursor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="cursor.js"></script>
</body>
