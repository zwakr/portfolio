<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">PROJET — ZAKARIA BAIT</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      line-height: 1.45;
      padding: 1.5vw 2vw 6vw 2vw;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Navigation supérieure unifiée style éditorial / trabuc.co */
    .top-nav {
      font-family: 'Monument Extended', -apple-system, sans-serif;
      font-weight: 800;
      font-size: clamp(1.1rem, 2.8vw, 2.5rem);
      line-height: 1;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      padding-bottom: 1.2rem;
      border-bottom: 1.5px solid #000000;
      margin-bottom: 2rem;
      user-select: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    /* Style des boutons Work & About / Info */
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 0.85rem;
      border: 1.5px solid #000000;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      background: transparent;
      text-decoration: none !important;
      cursor: pointer;
      text-transform: uppercase;
      font-family: inherit;
    }

    .nav-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .nav-btn.active {
      background: #000000;
      color: #ffffff;
    }

    /* En-tête du projet façon Trabuc.co */
    .project-header {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 3rem;
      margin-bottom: 3.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #000000;
    }

    .project-title {
      font-family: 'Monument Extended', -apple-system, sans-serif;
      font-weight: 800;
      font-size: clamp(1.8rem, 4vw, 4rem);
      line-height: 0.95;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    .project-subtitle {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      max-width: 650px;
      color: #222;
    }

    .project-meta {
      font-size: 12px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .meta-group b {
      font-weight: 700;
      display: block;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.04em;
      margin-bottom: 0.2rem;
    }

    /* Contenu du projet (Grille de médias / images / vidéos) */
    .project-media-flow {
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
    }

    .media-full {
      width: 100%;
    }

    .media-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .media-grid-asym {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1.5rem;
      align-items: center;
    }

    figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .project-media {
      width: 100%;
      height: auto;
      background: #f0f0f0;
      min-height: 380px;
      object-fit: cover;
      display: block;
    }

    figcaption {
      margin-top: 0.75rem;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      opacity: 0.85;
    }

    .project-narrative {
      font-size: 15px;
      line-height: 1.65;
      max-width: 820px;
      margin: 2rem 0;
      font-weight: 500;
    }

    /* Navigation entre projets en bas de page */
    .project-footer-nav {
      margin-top: 6rem;
      padding-top: 2rem;
      border-top: 1.5px solid #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Monument Extended', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    /* Responsive mobile */
    @media (max-width: 820px) {
      body {
        padding: 5vw 4vw;
      }
      .top-nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .project-header {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .media-grid-2, .media-grid-asym {
        grid-template-columns: 1fr;
      }
      .project-media {
        min-height: 240px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation principale avec boutons Work / About / Mail -->
  <nav class="top-nav">
    <a href="index.html">ZAKARIA BAIT</a>
    <div class="nav-links">
      <a href="work.html" class="nav-btn active">WORK</a>
      <a href="info.html" class="nav-btn">ABOUT</a>
      <a href="mailto:zakaria-bait@outlook.com" class="nav-btn">MAIL</a>
    </div>
  </nav>

  <!-- En-tête éditorial du projet -->
  <header class="project-header">
    <div>
      <h1 class="project-title" id="proj-title">Projet</h1>
      <p class="project-subtitle" id="proj-subtitle">
        Direction Artistique &amp; Exploration Graphique
      </p>
    </div>
    
    <div class="project-meta">
      <div class="meta-group">
        <b>Discipline</b>
        <span id="proj-discipline">Direction Artistique, Design</span>
      </div>
      <div class="meta-group">
        <b>Année</b>
        <span id="proj-year">2026</span>
      </div>
      <div class="meta-group">
        <b>Client / Contexte</b>
        <span id="proj-client">Marrakech — Studio</span>
      </div>
    </div>
  </header>

  <!-- Flux d'images et contenu dynamique -->
  <main class="project-media-flow" id="proj-flow">
    <!-- Généré dynamiquement en JS -->
  </main>

  <!-- Navigation de bas de page vers d'autres projets -->
  <footer class="project-footer-nav">
    <a href="work.html">← TOUS LES PROJETS</a>
    <a href="work.html" id="next-proj-link">PROJET SUIVANT →</a>
  </footer>

  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.PORTFOLIO_DATA || !window.PORTFOLIO_DATA.projects) {
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const projId = params.get('id');

      // Trouver le projet correspondant ou prendre le premier par défaut
      const projects = window.PORTFOLIO_DATA.projects.filter(p => p.type !== 'text');
      let currentIndex = projects.findIndex(p => p.id === projId);
      if (currentIndex === -1) currentIndex = 0;

      const project = projects[currentIndex];
      if (!project) return;

      // Catégorie lisible
      const catObj = (window.PORTFOLIO_DATA.categories || []).find(c => c.id === project.category);
      const catLabel = catObj ? catObj.label : (project.category || 'Direction Artistique');

      // Nettoyage du titre pour la balise <title>
      const rawTitle = project.title ? project.title.replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim() : 'PROJET';
      document.getElementById('page-title').textContent = `${rawTitle} — ZAKARIA BAIT`;
      document.getElementById('proj-title').innerHTML = project.title || 'Projet';
      
      document.getElementById('proj-subtitle').textContent = project.subtitle || project.cleanCaption || rawTitle;
      document.getElementById('proj-discipline').textContent = catLabel;
      document.getElementById('proj-year').textContent = project.year || '2026';
      document.getElementById('proj-client').textContent = project.client || 'Marrakech — Studio';

      // Médias
      const flow = document.getElementById('proj-flow');
      flow.innerHTML = '';

      const mainMedia = project.media || project.image || '';
      const isVideo = project.type === 'video';

      // 1. Média Héro Principal
      const heroFig = document.createElement('figure');
      heroFig.className = 'media-full';
      if (isVideo) {
        heroFig.innerHTML = mainMedia 
          ? `<video src="${mainMedia}" autoplay loop muted playsinline class="project-media" style="min-height:480px;"></video>`
          : `<div class="project-media" style="min-height:480px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#888;">VIDÉO PRINCIPALE</div>`;
      } else {
        heroFig.innerHTML = mainMedia 
          ? `<img src="${mainMedia}" class="project-media" alt="${rawTitle}">`
          : `<div class="project-media" style="min-height:480px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#888;">VISUEL PRINCIPAL DU PROJET</div>`;
      }
      heroFig.innerHTML += `<figcaption>01 &nbsp; &nbsp; ${rawTitle}</figcaption>`;
      flow.appendChild(heroFig);

      // 2. Texte narratif éditorial
      const narrativeText = project.narrative || project.textContent || `Le projet <b>${rawTitle}</b> explore la stratégie visuelle et l'identité de marque à travers un langage graphique singulier et précis, articulé autour de la composition et du contraste typographique.`;
      const narrativeDiv = document.createElement('div');
      narrativeDiv.className = 'project-narrative';
      narrativeDiv.innerHTML = narrativeText;
      flow.appendChild(narrativeDiv);

      // 3. Médias additionnels si présents (galerie)
      if (Array.isArray(project.gallery) && project.gallery.length > 0) {
        const grid2 = document.createElement('div');
        grid2.className = 'media-grid-2';
        project.gallery.forEach((gMedia, gIdx) => {
          grid2.innerHTML += `
            <figure>
              <img src="${gMedia}" class="project-media" alt="Détail ${gIdx + 2}">
              <figcaption>0${gIdx + 2} &nbsp; &nbsp; Étude visuelle et déclinaison</figcaption>
            </figure>
          `;
        });
        flow.appendChild(grid2);
      }

      // Lien Projet Suivant
      const nextIndex = (currentIndex + 1) % projects.length;
      const nextProj = projects[nextIndex];
      const nextBtn = document.getElementById('next-proj-link');
      if (nextProj) {
        nextBtn.href = `project-detail.html?id=${nextProj.id}`;
        nextBtn.textContent = `PROJET SUIVANT (${nextProj.id}) →`;
      }
    });
  </script>
</body>
</html>
