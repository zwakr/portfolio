<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%">
  <defs>
    <style>
      .monument { font-family: 'Monument Extended', 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .mono { font-family: -apple-system, 'SF Mono', 'Courier New', monospace; font-size: 13px; letter-spacing: 0.08em; }
    </style>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <rect x="50" y="50" width="1300" height="800" fill="none" stroke="#000000" stroke-width="4"/>
  
  <!-- Angled grid lines in black -->
  <g stroke="#ef202b" stroke-width="2" opacity="0.7">
    <line x1="50" y1="250" x2="650" y2="850"/>
    <line x1="250" y1="50" x2="1050" y2="850"/>
    <line x1="650" y1="50" x2="1350" y2="750"/>
  </g>

  <!-- Black solid geometry -->
  <rect x="120" y="120" width="500" height="660" fill="#000000"/>
  <text x="160" y="260" class="monument" font-size="42" fill="#ffffff">ÉTUDE DE</text>
  <text x="160" y="320" class="monument" font-size="42" fill="#ef202b">MATIÈRE &amp;</text>
  <text x="160" y="380" class="monument" font-size="42" fill="#ffffff">CONTRASTE</text>
  <text x="160" y="460" class="mono" fill="#ffffff" opacity="0.7">ESAV MARRAKECH — 2023/2025</text>
  <text x="160" y="500" class="mono" fill="#ffffff" opacity="0.7">RUPTURE DE CADRAGE</text>
  <text x="160" y="720" class="monument" font-size="70" fill="#ffffff" opacity="0.2">45°</text>

  <!-- Right side brutalist typography -->
  <text x="680" y="200" class="monument" font-size="64" fill="#000000">STRUCTURE</text>
  <text x="680" y="270" class="monument" font-size="64" fill="#ef202b">CINÉTIQUE</text>
  <line x1="680" y1="320" x2="1280" y2="320" stroke="#000000" stroke-width="3"/>
  
  <text x="680" y="380" class="mono" fill="#333333">// DIRECTION ARTISTIQUE INDÉPENDANTE</text>
  <text x="680" y="420" class="mono" fill="#333333">// EXPLORATION TYPOGRAPHIQUE ASYMÉTRIQUE</text>
  <text x="680" y="460" class="mono" fill="#333333">// CADRAGE D'INTENTION &amp; VOLUME</text>

  <rect x="680" y="520" width="600" height="260" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
  <text x="720" y="580" class="monument" font-size="20" fill="#000000">SYSTEME GRAPHIQUE 02 // 06</text>
  <text x="720" y="630" class="mono" fill="#666666">Tension formelle entre orthogonalité et diagonale.</text>
  <text x="720" y="660" class="mono" fill="#666666">Équilibre dynamique par compensation de masses.</text>
  <text x="720" y="730" class="monument" font-size="14" fill="#ef202b">ZAKARIA BAIT — DESIGN &amp; BRANDING</text>
</svg>