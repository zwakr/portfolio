<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORK — ZAKARIA BAIT</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: 'Monument Extended', -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* En-tête collant discret avec fond de verre */
    .sticky-header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 1.5vw 2vw 0.8rem 2vw;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1.5px solid #000000;
      transition: background 0.3s ease;
    }

    .top-nav {
      font-family: 'Monument Extended', -apple-system, sans-serif;
      font-weight: 800;
      font-size: clamp(1.1rem, 2.8vw, 2.5rem);
      line-height: 1;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      margin-bottom: 0.8rem;
      user-select: none;
    }

    .top-nav a {
      color: #000000;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    /* Boutons de navigation unifiés & Boutons Filtres */
    .nav-btn, .filter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem 0.6rem;
      border: 1px solid #000000;
      border-radius: 0px;
      font-family: 'Satoshi', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      background: transparent;
      color: #000000;
      text-decoration: none !important;
      cursor: pointer;
      text-transform: uppercase;
    }

    .nav-btn:hover, .filter-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .nav-btn.active, .filter-btn.active {
      background: #000000;
      color: #ffffff;
    }

    /* Barre de filtres de catégories */
    .project-filters {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .project-filters::-webkit-scrollbar {
      display: none;
    }

    /* Conteneur des cartes empilées style galerie / musée */
    .portfolio-stacked-container {
      width: 100%;
      position: relative;
    }

    .project-card-wrapper {
      position: relative;
      width: 100%;
      height: 145vh; /* Hauteur optimale pour un défilement doux */
    }

    /* La carte reste collée sous le header */
    .project-card {
      position: sticky;
      top: 80px;
      width: 100vw;
      height: calc(100vh - 85px);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      overflow: hidden;
      padding: 0 3vw;
    }

    /* Le cadre central de l'image (s'adapte au format paysage ET vertical) */
    .project-media-frame {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 66vw;
      max-height: 76vh;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform-origin: center center;
      text-decoration: none !important;
    }

    .project-media-frame img,
    .project-media-frame video {
      max-width: 100%;
      max-height: 76vh;
      width: auto;
      height: auto;
      object-fit: contain; /* S'adapte au paysage et au portrait sans rogner */
      display: block;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
    }

    .project-media-frame:hover img,
    .project-media-frame:hover video {
      transform: scale(1.015);
    }

    .img-placeholder {
      width: 48vw;
      height: 60vh;
      background-color: #f2f2f2;
      border: 1px dashed #cccccc;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888888;
      font-family: 'Satoshi', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Métadonnées sur les côtés (Flancs gauche et droite style musée) */
    .project-side-meta {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Satoshi', monospace, -apple-system, sans-serif;
      font-size: 11.5px;
      line-height: 1.45;
      letter-spacing: 0.02em;
      color: #111111;
      z-index: 10;
      pointer-events: none;
      max-width: 16vw;
      will-change: opacity, transform;
    }

    .side-left {
      left: 3.5vw;
      text-align: left;
    }

    .side-right {
      right: 3.5vw;
      text-align: right;
    }

    .meta-title {
      font-weight: 700;
      color: #000000;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .meta-sub, .meta-client, .meta-cat, .meta-year, .meta-index {
      color: #444444;
      font-weight: 400;
    }

    .meta-divider {
      color: #999999;
      letter-spacing: 0.12em;
      margin: 0.3rem 0;
      font-family: monospace;
      font-size: 10px;
    }

    /* Pied de page en fin de liste */
    .stacked-footer {
      position: relative;
      z-index: 60;
      background: #ffffff;
      padding: 5rem 2vw 4rem 2vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1.5px solid #000000;
      font-family: 'Satoshi', sans-serif;
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    .stacked-footer a {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
    }

    /* Responsive Mobile */
    @media (max-width: 820px) {
      .top-nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
      .project-card {
        padding: 0 1.5rem;
      }
      .project-media-frame {
        max-width: 90vw;
        max-height: 60vh;
      }
      .project-side-meta {
        position: static;
        transform: none;
        max-width: 100%;
        text-align: left !important;
        margin-top: 1rem;
      }
      .side-right {
        display: none; /* Sur mobile, on garde uniquement les infos principales à gauche */
      }
      .project-card {
        flex-direction: column;
        height: auto;
        min-height: 90vh;
      }
      .project-card-wrapper {
        height: 120vh;
      }
    }
  </style>
  <link rel="stylesheet" href="cursor.css">
</head>
<body id="top">

  <!-- En-tête fixe avec Navigation et Filtres -->
  <header class="sticky-header">
    <nav class="top-nav">
      <a href="index.html">ZAKARIA BAIT</a>
      <div class="nav-links">
        <a href="work.html" class="nav-btn active">WORK</a>
        <a href="info.html" class="nav-btn">INFO</a>
        <a href="mailto:zakaria-bait@outlook.com" class="nav-btn">MAIL</a>
      </div>
    </nav>
    <div class="project-filters" id="filters-container"></div>
  </header>

  <!-- Conteneur des projets plein écran empilés -->
  <main class="portfolio-stacked-container" id="portfolio-container"></main>

  <!-- Footer minimaliste -->
  <footer class="stacked-footer">
    <div>ZAKARIA BAIT — DIRECTION ARTISTIQUE &amp; BRANDING</div>
    <a href="#top">RETOUR EN HAUT ↑</a>
  </footer>

  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      const filtersContainer = document.getElementById('filters-container');
      const portfolioContainer = document.getElementById('portfolio-container');
      
      let data = window.PORTFOLIO_DATA || { projects: [], categories: [] };
      try {
        const draft = localStorage.getItem('portfolio_cms_draft');
        if (draft) {
          const parsed = JSON.parse(draft);
          if (parsed && Array.isArray(parsed.projects) && parsed.projects.length > 0) {
            data = parsed;
          }
        }
      } catch (e) {}

      if (!data || !data.projects) {
        console.error("Données portfolio introuvables.");
        return;
      }

      const totalCount = data.projects.length;

      // 1. GÉNÉRATION DES FILTRES DE CATÉGORIES
      filtersContainer.innerHTML = '';
      (data.categories || []).forEach((cat, index) => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (index === 0 ? ' active' : '');
        btn.setAttribute('data-filter', cat.id);
        btn.textContent = cat.label;
        filtersContainer.appendChild(btn);
      });

      // 2. GÉNÉRATION DES CARTES STYLE EXPOSITION MUSÉE
      portfolioContainer.innerHTML = '';
      (data.projects || []).forEach((proj, index) => {
        const mediaSrc = (proj.media || proj.image || '').trim();
        const category = proj.category || 'all';
        const defaultLink = `project-detail.html?id=${proj.id}`;
        const projectUrl = (proj.link && proj.link.trim() !== '' && proj.link.trim() !== '#') ? proj.link.trim() : defaultLink;
        const targetAttr = proj.openInNewTab ? 'target="_blank"' : '';

        // Catégorie lisible
        const catObj = (data.categories || []).find(c => c.id === category);
        const catLabel = catObj ? catObj.label : category.toUpperCase();

        const numStr = String(index + 1).padStart(2, '0');
        const totalStr = String(totalCount).padStart(2, '0');

        // Métadonnées éditoriales
        const detail = proj.detail || {};
        const cleanTitle = (proj.title || 'PROJET').replace(/&nbsp;/g, ' ').trim();
        const discipline = detail.discipline || detail.subtitle || 'Direction Artistique';
        const year = detail.year || '2026';
        const client = detail.client || 'Marrakech — Studio';

        let mediaHtml = '';
        if (proj.type === 'video' && mediaSrc) {
          mediaHtml = `<video src="${mediaSrc}" autoplay loop muted playsinline class="media-element"></video>`;
        } else if (mediaSrc) {
          mediaHtml = `<img src="${mediaSrc}" class="media-element" alt="${cleanTitle}">`;
        } else {
          mediaHtml = `<div class="img-placeholder">${cleanTitle}</div>`;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'project-card-wrapper';
        wrapper.setAttribute('data-category', category);

        wrapper.innerHTML = `
          <div class="project-card">
            <!-- Métadonnées Flanc Gauche -->
            <div class="project-side-meta side-left">
              <div class="meta-title">${cleanTitle}</div>
              <div class="meta-sub">${discipline}</div>
              <div class="meta-divider">--------</div>
              <div class="meta-year">${year}</div>
            </div>

            <!-- Cadre Central de l'Image (Adaptatif Paysage & Vertical) -->
            <a href="${projectUrl}" class="project-media-frame project-item" ${targetAttr}>
              ${mediaHtml}
            </a>

            <!-- Métadonnées Flanc Droit -->
            <div class="project-side-meta side-right">
              <div class="meta-client">${client}</div>
              <div class="meta-cat">(${catLabel})</div>
              <div class="meta-divider">--------</div>
              <div class="meta-index">${numStr} / ${totalStr}</div>
            </div>
          </div>
        `;

        portfolioContainer.appendChild(wrapper);
      });

      // 3. GESTION DU FILTRAGE
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const category = btn.getAttribute('data-filter');
          const wrappers = document.querySelectorAll('.project-card-wrapper');

          let visibleIndex = 0;
          wrappers.forEach(w => {
            const cat = w.getAttribute('data-category');
            if (category === 'all' || cat === category) {
              w.style.display = 'block';
              const card = w.querySelector('.project-card');
              if (card) {
                card.style.zIndex = 10 + visibleIndex;
              }
              visibleIndex++;
            } else {
              w.style.display = 'none';
            }
          });

          // Réinitialiser le scroll animation
          if (typeof initWorkCardScroll === 'function') {
            initWorkCardScroll();
          }
        });
      });

    });
  </script>

  <!-- GSAP & Clean Cursor & Full-page Card Scroll -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="cursor.js"></script>
  <script src="work-card-scroll.js"></script>
</body>
</html>
