<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORK — ZAKARIA BAIT</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      line-height: 1.45;
      padding: 1.5vw 2vw 6vw 2vw;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Barre de navigation supérieure */
    .top-nav {
      font-family: 'Monument Extended', -apple-system, sans-serif;
      font-weight: 800;
      font-size: clamp(1.1rem, 2.8vw, 2.5rem);
      line-height: 1;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      padding-bottom: 1.2rem;
      border-bottom: 1.5px solid #000000;
      margin-bottom: 0.7rem;
      user-select: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    /* Boutons de navigation unifiés & Boutons Filtres */
    .nav-btn, .filter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem 0.6rem;
      border: 1px solid #000000;
      border-radius: 0px;
      font-family: 'Satoshi', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      background: transparent;
      color: #000000;
      text-decoration: none !important;
      cursor: pointer;
      text-transform: uppercase;
      font-family: inherit;
    }

    .nav-btn:hover, .filter-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .nav-btn.active, .filter-btn.active {
      background: #000000;
      color: #ffffff;
    }

    /* Barre de filtres de projets */
    .project-filters {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 3.5rem;
      flex-wrap: wrap;
    }

    /* ------- GRILLE MODULAIRE 12 COLONNES ------- */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      column-gap: 0.25rem;
      row-gap: 2rem; /* Espace vertical pour respirer après les captions, typique de Cargo */
      align-items: start;
      margin-bottom: 4rem;
    }

    /* Tailles de colonnes configurables */
    .col-12 { grid-column: span 12; }
    .col-8  { grid-column: span 8; }
    .col-7  { grid-column: span 7; }
    .col-6  { grid-column: span 6; }
    .col-5  { grid-column: span 5; }
    .col-4  { grid-column: span 4; }
    .col-3  { grid-column: span 3; }

    figure {
      display: flex;
      flex-direction: column;
      margin: 0;
      width: 100%;
    }

    /* Médias (Images, Vidéos, GIFs) */
    .media-element {
      width: 100%;
      display: block;
      background-color: #f0f0f0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* Ratios / Proportions */
    .aspect-auto {
      height: auto;
      min-height: 250px;
      object-fit: cover;
    }
    .aspect-1-1 {
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }
    .aspect-16-9 {
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }
    .aspect-4-5 {
      aspect-ratio: 4 / 5;
      object-fit: cover;
    }
    .aspect-3-4 {
      aspect-ratio: 3 / 4;
      object-fit: cover;
    }

    /* Placeholder neutre */
    .img-placeholder {
      width: 100%;
      min-height: 260px;
      background-color: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999999;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    a:hover .media-element,
    a:hover .img-placeholder {
      opacity: 0.88;
    }

    figcaption {
      margin-top: 0.5rem;
      font-size: 13.5px;
      font-weight: normal;
      line-height: 1.45;
      padding-right: 0.5rem;
      color: #000;
    }

    /* Bloc de texte libre brutaliste */
    .text-block-item {
      font-size: 13.5px;
      line-height: 1.45;
      padding: 0.5rem 0; /* Minimal padding */
    }

    /* Animations de filtrage */
    .project-item {
      transition: opacity 0.35s ease, transform 0.35s ease;
      opacity: 1;
      transform: scale(1);
    }
    .project-item.hidden {
      display: none;
    }
    .project-item.fade-out {
      opacity: 0;
      transform: scale(0.98);
    }

    /* Curseur personnalisé (+) actif sur TOUS les projets */
    .gallery-grid .project-item,
    .gallery-grid .project-item *,
    .gallery-grid a {
      cursor: none !important;
    }
    
    #custom-cursor {
      position: fixed;
      top: 0; left: 0;
      width: 44px; height: 44px;
      background-color: #ef202b;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 300;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      z-index: 9999;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #custom-cursor.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    @media (pointer: coarse) {
      #custom-cursor {
        display: none !important;
      }
      .gallery-grid .project-item,
      .gallery-grid a {
        cursor: pointer !important;
      }
    }

    /* Responsive Mobile */
    @media (max-width: 820px) {
      body {
        padding: 5vw 4vw;
      }
      .top-nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        column-gap: 0.25rem;
        row-gap: 1.5rem;
      }
      .col-12, .col-8, .col-7, .col-6, .col-5, .col-4, .col-3 {
        grid-column: span 2;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation principale avec boutons unifiés -->
  <nav class="top-nav">
    <a href="index.html">ZAKARIA BAIT</a>
    <div class="nav-links">
      <a href="work.html" class="nav-btn active">WORK</a>
      <a href="info.html" class="nav-btn">INFO</a>
      <a href="mailto:zakaria-bait@outlook.com" class="nav-btn">MAIL</a>
    </div>
  </nav>

  <!-- Curseur personnalisé dynamique (+) -->
  <div id="custom-cursor">+</div>

  <main>
    
    <!-- Filtres par catégorie (générés dynamiquement) -->
    <div class="project-filters" id="filters-container"></div>

    <!-- Grille Principale Dynamique Modulaire -->
    <div class="gallery-grid" id="portfolio-container"></div>

  </main>

  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      const filtersContainer = document.getElementById('filters-container');
      const portfolioContainer = document.getElementById('portfolio-container');
      
      let data = window.PORTFOLIO_DATA || { projects: [], categories: [] };
      try {
        const draft = localStorage.getItem('portfolio_cms_draft');
        if (draft) {
          const parsed = JSON.parse(draft);
          if (parsed && Array.isArray(parsed.projects) && parsed.projects.length > 0) {
            data = parsed;
          }
        }
      } catch (e) {}

      if (!data || !data.projects) {
        console.error("Données portfolio introuvables.");
        return;
      }

      // 1. GÉNÉRATION DYNAMIQUE DES FILTRES DE CATÉGORIES
      filtersContainer.innerHTML = '';
      (data.categories || []).forEach((cat, index) => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (index === 0 ? ' active' : '');
        btn.setAttribute('data-filter', cat.id);
        btn.textContent = cat.label;
        filtersContainer.appendChild(btn);
      });

      // 2. GÉNÉRATION DES PROJETS & BLOCS MÉDIAS / TEXTE
      portfolioContainer.innerHTML = '';
      (data.projects || []).forEach(proj => {
        const layoutClass = proj.layout || 'col-6';
        const aspectClass = proj.aspectRatio || 'aspect-auto';
        const mediaSrc = (proj.media || proj.image || '').trim();
        const category = proj.category || 'all';
        
        // CAS 1 : Bloc de Texte libre
        if (proj.type === 'text') {
          const textEl = document.createElement('div');
          textEl.className = `project-item text-block-item ${layoutClass}`;
          textEl.setAttribute('data-category', category);
          textEl.innerHTML = proj.textContent || proj.title || '';
          portfolioContainer.appendChild(textEl);
          return;
        }

        // CAS 2 : Média de projet
        // Lie automatiquement vers project-detail.html?id=... si aucun lien externe n'est spécifié
        const defaultLink = `project-detail.html?id=${proj.id}`;
        const projectUrl = (proj.link && proj.link.trim() !== '' && proj.link.trim() !== '#') ? proj.link.trim() : defaultLink;
        
        const container = document.createElement('a');
        container.href = projectUrl;
        if (proj.openInNewTab) {
          container.target = '_blank';
        }
        container.className = `project-item ${layoutClass}`;
        container.setAttribute('data-category', category);

        // Rendu du média selon le type (Image, Vidéo, GIF)
        let mediaHtml = '';
        if (proj.type === 'video') {
          if (mediaSrc) {
            mediaHtml = `<video src="${mediaSrc}" autoplay loop muted playsinline class="media-element ${aspectClass}"></video>`;
          } else {
            mediaHtml = `<div class="img-placeholder ${aspectClass}">VIDÉO (AJOUTER FICHIER)</div>`;
          }
        } else if (proj.type === 'gif') {
          if (mediaSrc) {
            mediaHtml = `<img src="${mediaSrc}" class="media-element ${aspectClass}" alt="${proj.id}">`;
          } else {
            mediaHtml = `<div class="img-placeholder ${aspectClass}">GIF ANIMÉ (AJOUTER FICHIER)</div>`;
          }
        } else {
          // type image standard
          if (mediaSrc) {
            mediaHtml = `<img src="${mediaSrc}" class="media-element ${aspectClass}" alt="${proj.id}">`;
          } else {
            mediaHtml = `<div class="img-placeholder ${aspectClass}">PHOTO / VISUEL</div>`;
          }
        }

        const captionHtml = proj.title ? `<figcaption>${proj.title}</figcaption>` : '';

        container.innerHTML = `
          <figure>
            ${mediaHtml}
            ${captionHtml}
          </figure>
        `;

        portfolioContainer.appendChild(container);
      });

      // 3. GESTION ROBUSTE DU CURSEUR PERSONNALISÉ (+) PAR DÉLÉGATION D'ÉVÉNEMENTS
      const cursor = document.getElementById('custom-cursor');
      
      window.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });

      // Grâce à la délégation sur le conteneur, tous les projets (actuels ou futurs) activent le curseur !
      portfolioContainer.addEventListener('mouseover', (e) => {
        const item = e.target.closest('.project-item');
        if (item) {
          cursor.classList.add('visible');
        }
      });

      portfolioContainer.addEventListener('mouseout', (e) => {
        const item = e.target.closest('.project-item');
        if (item && !item.contains(e.relatedTarget)) {
          cursor.classList.remove('visible');
        }
      });

      portfolioContainer.addEventListener('mouseleave', () => {
        cursor.classList.remove('visible');
      });

      // 4. GESTION DU FILTRAGE FLUIDE PAR CATÉGORIE
      const filterBtns = document.querySelectorAll('.filter-btn');
      const projectItems = document.querySelectorAll('.project-item');

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const category = btn.getAttribute('data-filter');

          projectItems.forEach(item => {
            const itemCategory = item.getAttribute('data-category');
            const isText = item.classList.contains('text-block-item');
            
            if (category === 'all' || itemCategory === category || (isText && category === 'all')) {
              if (item.classList.contains('hidden')) {
                 item.classList.remove('hidden');
                 setTimeout(() => item.classList.remove('fade-out'), 20);
              }
            } else {
              item.classList.add('fade-out');
              setTimeout(() => {
                if (item.classList.contains('fade-out')) {
                  item.classList.add('hidden');
                }
              }, 350);
            }
          });
        });
      });

    });
  </script>
</body>
</html>
