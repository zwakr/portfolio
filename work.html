<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORK — ZAKARIA BAIT</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: 'Monument Extended', -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* En-tête collant qui reste au-dessus sans masquer les cartes */
    .sticky-header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 1.5vw 2vw 0.8rem 2vw;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1.5px solid #000000;
      transition: background 0.3s ease;
    }

    .top-nav {
      font-family: 'Monument Extended', -apple-system, sans-serif;
      font-weight: 800;
      font-size: clamp(1.1rem, 2.8vw, 2.5rem);
      line-height: 1;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      margin-bottom: 0.8rem;
      user-select: none;
    }

    .top-nav a {
      color: #000000;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    /* Boutons de navigation unifiés & Boutons Filtres */
    .nav-btn, .filter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem 0.6rem;
      border: 1px solid #000000;
      border-radius: 0px;
      font-family: 'Satoshi', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      background: transparent;
      color: #000000;
      text-decoration: none !important;
      cursor: pointer;
      text-transform: uppercase;
    }

    .nav-btn:hover, .filter-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .nav-btn.active, .filter-btn.active {
      background: #000000;
      color: #ffffff;
    }

    /* Barre de filtres de catégories */
    .project-filters {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .project-filters::-webkit-scrollbar {
      display: none;
    }

    /* Espace sous le header */
    .header-spacer {
      height: 115px;
    }

    /* Conteneur des cartes empilées plein écran */
    .portfolio-stacked-container {
      width: 100%;
      position: relative;
    }

    /* Chaque projet dispose d'une hauteur de scroll pour rétrécir */
    .project-card-wrapper {
      position: relative;
      width: 100%;
      height: 140vh; /* Permet un rétrécissement très progressif */
    }

    /* La carte reste collée sous le header */
    .project-card {
      position: sticky;
      top: 85px;
      width: 100%;
      height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff; /* Le blanc qui apparaît tout autour lors du scale */
      overflow: hidden;
    }

    /* L'élément qui rétrécit au scroll (scale-down) */
    .project-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform-origin: center center;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0a0a0a;
      text-decoration: none !important;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
    }

    .project-media-wrap {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    .media-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .project-card-inner:hover .media-element {
      transform: scale(1.02);
    }

    .img-placeholder {
      width: 100%;
      height: 100%;
      background-color: #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666666;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Légende éditoriale incrustée dans la carte */
    .project-card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 3rem 3.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
    }

    .project-index {
      font-family: 'Monument Extended', sans-serif;
      font-size: clamp(1.6rem, 3.8vw, 3.5rem);
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
    }

    .project-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      text-align: right;
    }

    .project-title {
      font-family: 'Satoshi', -apple-system, sans-serif;
      font-size: clamp(13px, 1.4vw, 19px);
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      max-width: 60vw;
    }

    .project-tag {
      font-family: 'Satoshi', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 0.15rem 0.5rem;
    }

    /* Pied de page en fin de liste */
    .stacked-footer {
      position: relative;
      z-index: 60;
      background: #ffffff;
      padding: 5rem 2vw 4rem 2vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1.5px solid #000000;
      font-family: 'Satoshi', sans-serif;
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    .stacked-footer a {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
    }

    /* Responsive Mobile */
    @media (max-width: 820px) {
      .header-spacer {
        height: 145px;
      }
      .top-nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
      .project-card-overlay {
        padding: 1.5rem;
      }
      .project-card-wrapper {
        height: 125vh;
      }
    }
  </style>
  <link rel="stylesheet" href="cursor.css">
</head>
<body id="top">

  <!-- En-tête fixe avec Navigation et Filtres -->
  <header class="sticky-header">
    <nav class="top-nav">
      <a href="index.html">ZAKARIA BAIT</a>
      <div class="nav-links">
        <a href="work.html" class="nav-btn active">WORK</a>
        <a href="info.html" class="nav-btn">INFO</a>
        <a href="mailto:zakaria-bait@outlook.com" class="nav-btn">MAIL</a>
      </div>
    </nav>
    <div class="project-filters" id="filters-container"></div>
  </header>

  <!-- Conteneur des projets plein écran empilés -->
  <main class="portfolio-stacked-container" id="portfolio-container"></main>

  <!-- Footer minimaliste -->
  <footer class="stacked-footer">
    <div>ZAKARIA BAIT — DIRECTION ARTISTIQUE &amp; BRANDING</div>
    <a href="#top">RETOUR EN HAUT ↑</a>
  </footer>

  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      const filtersContainer = document.getElementById('filters-container');
      const portfolioContainer = document.getElementById('portfolio-container');
      
      let data = window.PORTFOLIO_DATA || { projects: [], categories: [] };
      try {
        const draft = localStorage.getItem('portfolio_cms_draft');
        if (draft) {
          const parsed = JSON.parse(draft);
          if (parsed && Array.isArray(parsed.projects) && parsed.projects.length > 0) {
            data = parsed;
          }
        }
      } catch (e) {}

      if (!data || !data.projects) {
        console.error("Données portfolio introuvables.");
        return;
      }

      // 1. GÉNÉRATION DES FILTRES DE CATÉGORIES
      filtersContainer.innerHTML = '';
      (data.categories || []).forEach((cat, index) => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (index === 0 ? ' active' : '');
        btn.setAttribute('data-filter', cat.id);
        btn.textContent = cat.label;
        filtersContainer.appendChild(btn);
      });

      // 2. GÉNÉRATION DES CARTES PLEIN ÉCRAN
      portfolioContainer.innerHTML = '';
      (data.projects || []).forEach((proj, index) => {
        const mediaSrc = (proj.media || proj.image || '').trim();
        const category = proj.category || 'all';
        const defaultLink = `project-detail.html?id=${proj.id}`;
        const projectUrl = (proj.link && proj.link.trim() !== '' && proj.link.trim() !== '#') ? proj.link.trim() : defaultLink;
        const targetAttr = proj.openInNewTab ? 'target="_blank"' : '';

        // Catégorie lisible
        const catObj = (data.categories || []).find(c => c.id === category);
        const catLabel = catObj ? catObj.label : category.toUpperCase();

        const numStr = String(index + 1).padStart(2, '0');

        let mediaHtml = '';
        if (proj.type === 'video' && mediaSrc) {
          mediaHtml = `<video src="${mediaSrc}" autoplay loop muted playsinline class="media-element"></video>`;
        } else if (mediaSrc) {
          mediaHtml = `<img src="${mediaSrc}" class="media-element" alt="${proj.title || proj.id}">`;
        } else {
          mediaHtml = `<div class="img-placeholder">${proj.title || 'VISUEL DU PROJET'}</div>`;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'project-card-wrapper';
        wrapper.setAttribute('data-category', category);

        wrapper.innerHTML = `
          <div class="project-card">
            <a href="${projectUrl}" class="project-card-inner project-item" ${targetAttr}>
              <div class="project-media-wrap">
                ${mediaHtml}
              </div>
              <div class="project-card-overlay">
                <div class="project-index">${numStr}</div>
                <div class="project-meta">
                  <div class="project-title">${proj.title || 'PROJET'}</div>
                  <div class="project-tag">${catLabel}</div>
                </div>
              </div>
            </a>
          </div>
        `;

        portfolioContainer.appendChild(wrapper);
      });

      // 3. GESTION DU FILTRAGE
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const category = btn.getAttribute('data-filter');
          const wrappers = document.querySelectorAll('.project-card-wrapper');

          let visibleIndex = 0;
          wrappers.forEach(w => {
            const cat = w.getAttribute('data-category');
            if (category === 'all' || cat === category) {
              w.style.display = 'block';
              const card = w.querySelector('.project-card');
              if (card) {
                card.style.zIndex = 10 + visibleIndex;
              }
              visibleIndex++;
            } else {
              w.style.display = 'none';
            }
          });

          // Réinitialiser le scroll animation
          if (typeof initWorkCardScroll === 'function') {
            initWorkCardScroll();
          }
        });
      });

    });
  </script>

  <!-- GSAP & Clean Cursor & Full-page Card Scroll -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="cursor.js"></script>
  <script src="work-card-scroll.js"></script>
</body>
</html>
