<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INFO — ZAKARIA BAIT</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: 'Satoshi', -apple-system, sans-serif;
      font-size: 13.5px;
      line-height: 1.1;
      padding: 1.5vw 2vw 6vw 2vw;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Barre de navigation supérieure - RETOUR AU DESIGN ORIGINAL PILL BUTTONS */
    .top-nav {
      font-family: 'Monument Extended', -apple-system, sans-serif;
      font-weight: 800;
      font-size: clamp(1.1rem, 2.8vw, 2.5rem);
      line-height: 1;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      padding-bottom: 1.2rem;
      border-bottom: 1.5px solid #000000;
      margin-bottom: 0.7rem;
    }
    .nav-links {
      display: flex;
      gap: 1.5vw;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem 0.6rem;
      border: 1px solid #000000;
      border-radius: 0px;
      font-family: 'Satoshi', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      color: #000000;
    }
    .nav-btn:hover {
      background: #000000;
      color: #ffffff;
    }
    .nav-btn.active {
      background: #000000;
      color: #ffffff;
      pointer-events: none;
    }

    /* Styles demandés par l'utilisateur */
    .cargo-lang-switch {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      margin-bottom: -1rem;
      gap: 4px;
      opacity: 0.85;
    }
    .cargo-lang-btn {
      background: transparent;
      border: none;
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      padding: 2px 4px;
      opacity: 0.45;
      transition: opacity 0.2s, font-weight 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .cargo-lang-btn:hover {
      opacity: 0.85;
    }
    .cargo-lang-btn.active {
      opacity: 1;
      font-weight: bold;
      text-decoration: underline;
    }

    /* Mode Arabe : Inversion complète Gauche -> Droite (RTL) */
    #cargo-lang-wrapper.is-ar {
      direction: rtl !important;
      text-align: right !important;
    }
    #cargo-lang-wrapper.is-ar .column-set,
    #cargo-lang-wrapper.is-ar .column-unit {
      direction: rtl !important;
      text-align: right !important;
    }

    /* Traduction des custom elements Cargo en CSS Standard */
    .column-set {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 0.5rem;
      width: 100%;
    }
    .span-6 { grid-column: span 6; }
    .span-3 { grid-column: span 3; }
    
    hr {
      border: none;
      border-top: 1px solid #000;
      margin-bottom: 0.5rem;
    }

    .media-item-container {
      text-align: center;
      margin-top: 2rem;
    }
    .media-item-container img {
      max-width: 30%;
      height: auto;
      margin-bottom: 0.5rem;
    }

    @media (max-width: 820px) {
      body {
        padding: 5vw 4vw;
      }
      .top-nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .column-set {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
      .media-item-container img {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation principale avec le style original restauré ! -->
  <nav class="top-nav">
    <a href="index.html">ZAKARIA BAIT</a>
    <div class="nav-links">
      <a href="work.html" class="nav-btn">WORK</a>
      <a href="info.html" class="nav-btn active">INFO</a>
      <a href="mailto:zakaria-bait@outlook.com" class="nav-btn">MAIL</a>
    </div>
  </nav>

  <div class="cargo-lang-switch">
    <button class="cargo-lang-btn active" id="btn-fr" onclick="switchLanguage('fr')" type="button">FR</button>
    <span style="opacity: 0.3;">/</span>
    <button class="cargo-lang-btn" id="btn-en" onclick="switchLanguage('en')" type="button">EN</button>
    <span style="opacity: 0.3;">/</span>
    <button class="cargo-lang-btn" id="btn-ar" onclick="switchLanguage('ar')" type="button">AR</button>
  </div>

  <div id="cargo-lang-wrapper">
    <br><br>
    
    <!-- SECTION 1: CONTACT / PROFIL / APPROCHE -->
    <div class="column-set">
      <div class="column-unit span-6" id="txt-contact"></div>
      <div class="column-unit span-3" id="txt-profil"></div>
      <div class="column-unit span-3" id="txt-approche"></div>
    </div>
    
    <br><br><hr>

    <!-- SECTION 1.5: PARCOURS (RESTORED) -->
    <div class="column-set">
      <div class="column-unit span-6" id="txt-cv-title"></div>
      <div class="column-unit span-3" id="txt-cv-exp"></div>
      <div class="column-unit span-3" id="txt-cv-edu"></div>
    </div>

    <br><br><hr>

    <!-- SECTION 2: EXPERTISES -->
    <div class="column-set">
      <div class="column-unit span-6" id="txt-exp-title"></div>
      <div class="column-unit span-3" id="txt-exp-col1"></div>
      <div class="column-unit span-3" id="txt-exp-col2"></div>
    </div>
    
    <br><br><br><hr>

    <!-- SECTION 3: SELECTION & PROJETS -->
    <div class="column-set">
      <div class="column-unit span-6" id="txt-proj-title"></div>
      <div class="column-unit span-3" id="txt-proj-col1"></div>
      <div class="column-unit span-3" id="txt-proj-col2"></div>
    </div>

    <div class="media-item-container">
      <img src="" alt="Zakaria Bait" onerror="this.style.display='none'">
      <figcaption class="caption" id="txt-caption"></figcaption>
    </div>
  </div>

  <br><br><br><br><br><br><br><br><br><br><br><br>

  <script>
  // On restaure les textes manquants de la section Parcours dans le dictionnaire
  const siteContent = {
    fr: {
      contact: `<hr>Contact<br><br>Marrakech<br>Maroc<br><br>zakaria-bait@outlook.com<br><a target="_blank" href="https://www.instagram.com/zakaria.bait/">@zeeekob</a><br>`,
      profil: `<hr>Profil<br><br>Zakaria Bait Graphiste Directeur Artistique indépendant basé à Marrakech, spécialisé dans la stratégie de marque (branding) et la création d'identités visuelles. Mon approche fusionne la réflexion stratégique avec une exécution visuelle précise, intégrant ponctuellement des éléments de conception 3D pour donner du volume et de la texture aux récits de marque.&nbsp;<br>J’utilise le volume, la typographie et l'image pour construire des univers cohérents et ancrés dans la réalité.<br><br>`,
      approche: `<hr>Approche<br><br>Je crois en un design intentionnel. Mon processus commence toujours par déconstruire le problème à partir de ses principes premiers avant de toucher au moindre outil graphique. Qu'il s'agisse du lancement d'une marque de vêtements ou de l'identité d'un projet, chaque décision typographique ou choix de direction artistique doit servir le positionnement stratégique. L'esthétique est pour moi la conséquence d'une bonne stratégie, jamais son point de départ.<br><br>`,
      cvTitle: `Parcours<br><br><br>`,
      cvExp: `Expériences<br><br><b>Hivernage Collection</b><br>Graphiste — Direction visuelle 360° pour marques premium (print &amp; digital).<br>Depuis Oct. 2025<br><br><hr><b>Vinca Digital</b><br>Direction Artistique &amp; Event Branding — Identité sportive, signalétique grand format.<br>Juil. – Août 2025<br><br><hr><b>Brandoo Agency</b><br>Design Graphique — Création d'identités visuelles et campagnes à impact social.<br>Juin – Juil. 2024<br><br><br>`,
      cvEdu: `Formation<br><br><b>École Supérieure des Arts Visuels (ESAV)</b><br>Diplôme en Design Graphique Numérique.<br>Marrakech, 2023 - 2025<br><br><br>`,
      expTitle: `Expertises<br><br><br>`,
      expCol1: `Direction Artistique &amp; Branding<hr>Stratégie de Marque<br><hr>Identité Visuelle<hr>Design Typographique<hr>Direction de Création<br><hr>Design Éditorial<hr>Positionnement Stratégique<br><br><br>`,
      expCol2: `Exploration &amp; Volume<hr>Conception 3D (Concepts)<hr>Modélisation de Produits<br><hr>Recherche Visuelle<hr>Moodboarding&nbsp;<br><hr>Intégration Outils IA`,
      projTitle: `Sélection &amp; Projets :`,
      projCol1: `En cours<br><br>Marque de Vêtements (TBA)&nbsp;<br>Co-fondateur &amp; DA<br>2026 - 2027<br><br><i>Projet 45 Degrés</i><br>Exploration Visuelle,<br>Recherche DA<br>2026`,
      projCol2: `Avenir<br><br>Série Portfolio 3D<br>Concepts &amp; Rendus,<br>Direction Artistique<br>pour 2027<br><br>Identités Visuelles<br>Freelance,<br>Design Graphique,<br>Marrakech<br>2024 - 2025<br><br><i>Collectif Créatif</i><br>Direction de Production,<br>Avec Ilias &amp; Khalil<br>2026<br><br><br><br><br>`,
      caption: `Zakaria Bait — Directeur Artistique, Marrakech (Maroc)`
    },
    en: {
      contact: `<hr>Contact<br><br>Marrakech<br>Morocco<br><br>zakaria-bait@outlook.com<br><a target="_blank" href="https://www.instagram.com/zakaria.bait/">@zeeekob</a><br>`,
      profil: `<hr>Profile<br><br>Zakaria Bait, freelance Graphic Designer & Art Director based in Marrakech, specializing in brand strategy and visual identity design. My approach merges strategic thinking with precise visual execution, occasionally integrating 3D design elements to bring volume and texture to brand narratives.&nbsp;<br>I use volume, typography, and imagery to craft coherent universes rooted in reality.<br><br>`,
      approche: `<hr>Approach<br><br>I believe in intentional design. My process always begins by deconstructing the problem down to its first principles before touching any graphic tool. Whether launching a clothing line or developing a project's identity, every typographic choice and art direction decision must serve the strategic positioning. For me, aesthetics are the outcome of a solid strategy, never its starting point.<br><br>`,
      cvTitle: `Background<br><br><br>`,
      cvExp: `Experience<br><br><b>Hivernage Collection</b><br>Graphic Designer — 360° visual direction for premium brands.<br>Since Oct 2025<br><br><hr><b>Vinca Digital</b><br>Art Direction &amp; Event Branding — Sports identity and large-scale signage.<br>Jul – Aug 2025<br><br><hr><b>Brandoo Agency</b><br>Graphic Designer — Visual identities and high-impact social campaigns.<br>Jun – Jul 2024<br><br><br>`,
      cvEdu: `Education<br><br><b>École Supérieure des Arts Visuels (ESAV)</b><br>Digital Graphic Design Degree.<br>Marrakech, 2023 - 2025<br><br><br>`,
      expTitle: `Expertise<br><br><br>`,
      expCol1: `Art Direction &amp; Branding<hr>Brand Strategy<br><hr>Visual Identity<hr>Typography Design<hr>Creative Direction<br><hr>Editorial Design<hr>Strategic Positioning<br><br><br>`,
      expCol2: `Exploration &amp; Volume<hr>3D Design (Concepts)<hr>Product Modeling<br><hr>Visual Research<hr>Moodboarding&nbsp;<br><hr>AI Tools Integration`,
      projTitle: `Selected Projects:`,
      projCol1: `Ongoing<br><br>Clothing Brand (TBA)&nbsp;<br>Co-founder &amp; AD<br>2026 - 2027<br><br><i>Project 45 Degrees</i><br>Visual Exploration,<br>AD Research<br>2026`,
      projCol2: `Upcoming<br><br>3D Portfolio Series<br>Concepts &amp; Renders,<br>Art Direction<br>for 2027<br><br>Visual Identities<br>Freelance,<br>Graphic Design,<br>Marrakech<br>2024 - 2025<br><br><i>Creative Collective</i><br>Production Direction,<br>With Ilias &amp; Khalil<br>2026<br><br><br><br><br>`,
      caption: `Zakaria Bait — Art Director, Marrakech (Morocco)`
    },
    ar: {
      contact: `<hr>اتصال<br><br>مراكش<br>المغرب<br><br>zakaria-bait@outlook.com<br><a target="_blank" href="https://www.instagram.com/zakaria.bait/">@zeeekob</a><br>`,
      profil: `<hr>نبذة<br><br>زكرياء بايت، مصمم جرافيك ومدير فني مستقل مقيم في مراكش، متخصّص في استراتيجية العلامات التجارية وتصميم الهويات البصرية. يجمع نهجي بين التفكير الاستراتيجي والتنفيذ البصري الدقيق، مع دمج عناصر ثلاثية الأبعاد لمنح سرديات العلامات التجارية بعداً وملمساً واقعياً.&nbsp;<br>أوظف الكتلة، التيبوغرافيا والصورة لبناء عوالم متماسكة ومتجذرة في الواقع.<br><br>`,
      approche: `<hr>الرؤية والمنهج<br><br>أؤمن بالتصميم الهادف. تبدأ منهجيتي دائماً بتفكيك المشكلة إلى مبادئها الأساسية قبل لمس أي أداة تصميم. وسواء كان العمل على إطلاق علامة ملابس أو تصميم هوية مشروع، فإن كل قرار تيبوغرافي واختيار فني يجب أن يخدم التموضع الاستراتيجي. الجماليات بالنسبة لي هي نتيجة حتمية لاستراتيجية ناجحة وليست نقطة انطلاقها أبداً.<br><br>`,
      cvTitle: `المسار<br><br><br>`,
      cvExp: `الخبرة المهنية<br><br><b>Hivernage Collection</b><br>مصمم جرافيك — توجيه بصري شامل لعلامات تجارية فاخرة.<br>منذ أكتوبر 2025<br><br><hr><b>Vinca Digital</b><br>إدارة فنية وتصميم فعاليات — هوية رياضية ولافتات ضخمة.<br>يوليو – غشت 2025<br><br><hr><b>Brandoo Agency</b><br>مصمم جرافيك — هويات بصرية وحملات ذات تأثير اجتماعي.<br>يونيو – يوليو 2024<br><br><br>`,
      cvEdu: `التعليم<br><br><b>المدرسة العليا للفنون البصرية (ESAV)</b><br>دبلوم في التصميم الجرافيكي الرقمي.<br>مراكش، 2023 - 2025<br><br><br>`,
      expTitle: `مجالات الخبرة<br><br><br>`,
      expCol1: `الإدارة الفنية وبناء العلامات<hr>استراتيجية العلامة التجارية<br><hr>الهوية البصرية<hr>تصميم التيبوغرافيا والخط<hr>الإدارة الإبداعية<br><hr>التصميم التحريري<hr>التموضع الاستراتيجي<br><br><br>`,
      expCol2: `الاستكشاف والأبعاد<hr>تصميم ثلاثي الأبعاد (مفاهيم)<hr>نمذجة المنتجات<br><hr>البحث البصري<hr>لوحات الإلهام (Moodboarding)&nbsp;<br><hr>دمج أدوات الذكاء الاصطناعي`,
      projTitle: `مشاريع مختارة :`,
      projCol1: `قيد الإنجاز<br><br>علامة ملابس (تُعلن لاحقاً)&nbsp;<br>شريك مؤسس ومدير فني<br>2026 - 2027<br><br><i>مشروع 45 درجة</i><br>استكشاف بصري،<br>بحث في الإدارة الفنية<br>2026`,
      projCol2: `مشاريع قادمة<br><br>سلسلة أعمال 3D<br>مفاهيم وتصيير،<br>إدارة فنية<br>لعام 2027<br><br>هويات بصرية<br>عمل حر،<br>تصميم جرافيك،<br>مراكش<br>2024 - 2025<br><br><i>تجمع إبداعي</i><br>إدارة الإنتاج،<br>مع إلياس وخليل<br>2026<br><br><br><br><br>`,
      caption: `زكرياء بايت — مدير فني، مراكش (المغرب)`
    }
  };

  function switchLanguage(lang) {
    const wrapper = document.getElementById('cargo-lang-wrapper');
    const data = siteContent[lang];
    if (!data || !wrapper) return;

    // Mise à jour des textes
    document.getElementById('txt-contact').innerHTML = data.contact;
    document.getElementById('txt-profil').innerHTML = data.profil;
    document.getElementById('txt-approche').innerHTML = data.approche;
    
    // Ajout de la section parcours restaurée
    document.getElementById('txt-cv-title').innerHTML = data.cvTitle;
    document.getElementById('txt-cv-exp').innerHTML = data.cvExp;
    document.getElementById('txt-cv-edu').innerHTML = data.cvEdu;

    document.getElementById('txt-exp-title').innerHTML = data.expTitle;
    document.getElementById('txt-exp-col1').innerHTML = data.expCol1;
    document.getElementById('txt-exp-col2').innerHTML = data.expCol2;
    document.getElementById('txt-proj-title').innerHTML = data.projTitle;
    document.getElementById('txt-proj-col1').innerHTML = data.projCol1;
    document.getElementById('txt-proj-col2').innerHTML = data.projCol2;
    document.getElementById('txt-caption').innerHTML = data.caption;

    // Gestion du sens de lecture (RTL pour l'arabe, LTR sinon)
    if (lang === 'ar') {
      wrapper.classList.add('is-ar');
    } else {
      wrapper.classList.remove('is-ar');
    }

    // État actif des boutons
    document.querySelectorAll('.cargo-lang-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.getElementById('btn-' + lang);
    if (activeBtn) activeBtn.classList.add('active');
  }

  // Initialisation par défaut
  document.addEventListener('DOMContentLoaded', () => {
    switchLanguage('fr');
  });
  </script>
</body>
</html>
