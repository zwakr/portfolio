<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <style>
      .monument { font-family: 'Monument Extended', 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .mono { font-family: -apple-system, 'SF Mono', 'Courier New', monospace; font-size: 14px; letter-spacing: 0.1em; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1600" height="1000" fill="#ef202b"/>
  
  <!-- Angled 45 deg graphic lines -->
  <g stroke="#000000" stroke-width="4" opacity="0.9">
    <line x1="-200" y1="200" x2="1000" y2="-1000" stroke-width="8"/>
    <line x1="200" y1="1200" x2="1800" y2="-400" stroke-width="12"/>
    <line x1="400" y1="1400" x2="2000" y2="-200" stroke-width="4"/>
    <line x1="600" y1="1600" x2="2200" y2="0" stroke-width="6"/>
  </g>

  <!-- Big black brutalist block -->
  <rect x="80" y="120" width="1440" height="760" fill="#000000"/>
  
  <!-- Red geometric accents -->
  <polygon points="80,120 450,120 80,490" fill="#ef202b"/>
  <polygon points="1520,880 1150,880 1520,510" fill="#ef202b"/>

  <!-- Framing & Crosshairs -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.6">
    <line x1="120" y1="160" x2="180" y2="160"/>
    <line x1="120" y1="160" x2="120" y2="220"/>
    <line x1="1480" y1="160" x2="1420" y2="160"/>
    <line x1="1480" y1="160" x2="1480" y2="220"/>
    <line x1="120" y1="840" x2="180" y2="840"/>
    <line x1="120" y1="840" x2="120" y2="780"/>
    <line x1="1480" y1="840" x2="1420" y2="840"/>
    <line x1="1480" y1="840" x2="1480" y2="780"/>
  </g>

  <!-- Massive Typography -->
  <text x="160" y="420" class="monument" font-size="110" fill="#ffffff" letter-spacing="-2">45° DEGRÉS</text>
  <text x="165" y="510" class="monument" font-size="36" fill="#ef202b" letter-spacing="4">DIRECTION ARTISTIQUE &amp; EXPLORATION</text>
  <text x="165" y="580" class="mono" fill="#ffffff" opacity="0.8">REF: PROJ_021 // STUDIO MARRAKECH // ÉTUDE GÉOMÉTRIQUE OBLIQUE</text>
  
  <!-- Bottom Data -->
  <line x1="160" y1="760" x2="1440" y2="760" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <text x="160" y="800" class="mono" fill="#ffffff">ZAKARIA BAIT — ART DIRECTION &amp; VISUAL IDENTITY</text>
  <text x="1360" y="800" class="mono" fill="#ef202b" font-weight="bold">2026 // MOROCCO</text>
</svg>