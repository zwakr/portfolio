<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <style>
      .monument { font-family: 'Monument Extended', 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .mono { font-family: -apple-system, 'SF Mono', 'Courier New', monospace; font-size: 13px; letter-spacing: 0.1em; }
    </style>
  </defs>
  <rect width="900" height="1200" fill="#000000"/>
  
  <!-- Outer red border -->
  <rect x="40" y="40" width="820" height="1120" fill="none" stroke="#ef202b" stroke-width="3"/>
  
  <!-- Angled geometry wireframe -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.8">
    <polygon points="450,150 750,450 450,750 150,450" fill="none" stroke="#ef202b" stroke-width="4"/>
    <line x1="150" y1="450" x2="750" y2="450"/>
    <line x1="450" y1="150" x2="450" y2="750"/>
    <circle cx="450" cy="450" r="120" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,6"/>
  </g>

  <!-- Massive Vertically oriented Text -->
  <text x="80" y="880" class="monument" font-size="64" fill="#ffffff">VOLUME 3D</text>
  <text x="80" y="950" class="monument" font-size="42" fill="#ef202b">&amp; CADRAGE OBLIQUE</text>
  
  <line x1="80" y1="1000" x2="820" y2="1000" stroke="#ef202b" stroke-width="2"/>
  
  <text x="80" y="1040" class="mono" fill="#ffffff">CADRE EXPÉRIMENTAL // 45° SYSTEM</text>
  <text x="80" y="1070" class="mono" fill="#888888">CONCEPTION &amp; DIRECTION : ZAKARIA BAIT</text>
  <text x="80" y="1100" class="mono" fill="#ef202b">MARRAKECH // 2026</text>
</svg>