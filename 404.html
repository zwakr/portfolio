<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — ZAKARIA BAIT</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">
  <link rel="stylesheet" href="cursor.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: 'Monument Extended', -apple-system, sans-serif;
    }

    /* Le lien pour revenir à l'accueil */
    .back-home {
      position: absolute;
      top: 1.5vw;
      left: 2vw;
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(1.2rem, 3.2vw, 3rem);
      text-transform: uppercase;
      text-decoration: none;
      z-index: 10;
      mix-blend-mode: difference;
      transition: opacity 0.2s ease;
    }
    
    .back-home:hover {
      opacity: 0.7;
    }

    /* Média en plein écran */
    .media-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: #000000;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-home">ZAKARIA BAIT</a>

  <div class="media-container">
    <img id="bgMedia" src="video_404.gif" alt="404 — Page Non Trouvée">
  </div>

  <!-- GSAP & Clean Cursor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="cursor.js"></script>

</body>
</html>
