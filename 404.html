<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — ZAKARIA BAIT</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: 'Monument Extended', -apple-system, sans-serif;
    }

    /* Le lien pour revenir à l'accueil */
    .back-home {
      position: absolute;
      top: 1.5vw;
      left: 2vw;
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(1.2rem, 3.2vw, 3rem);
      text-transform: uppercase;
      text-decoration: none;
      z-index: 10;
      mix-blend-mode: difference; /* Permet au texte de rester lisible sur la vidéo */
    }
    
    .back-home:hover {
      opacity: 0.7;
    }

    /* Vidéo en plein écran */
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Recadre la vidéo pour remplir tout l'écran sans déformer */
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-home">ZAKARIA BAIT</a>

  <div class="video-container">
    <!-- Remplace "video_404.mp4" par le nom de ton fichier vidéo -->
    <video autoplay loop muted playsinline>
      <source src="video_404.mp4" type="video/mp4">
      Ton navigateur ne supporte pas la vidéo.
    </video>
  </div>

</body>
</html>
