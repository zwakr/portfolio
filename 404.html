<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — ZAKARIA BAIT</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: 'Monument Extended', -apple-system, sans-serif;
    }

    /* Le lien pour revenir à l'accueil */
    .back-home {
      position: absolute;
      top: 1.5vw;
      left: 2vw;
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(1.2rem, 3.2vw, 3rem);
      text-transform: uppercase;
      text-decoration: none;
      z-index: 10;
      mix-blend-mode: difference;
      transition: opacity 0.2s ease;
    }
    
    .back-home:hover {
      opacity: 0.7;
    }

    /* Vidéo en plein écran */
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: #000000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Message de secours si la vidéo met du temps ou est absente */
    .fallback-message {
      position: absolute;
      bottom: 2rem;
      left: 2vw;
      color: #666;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      z-index: 5;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-home">ZAKARIA BAIT</a>

  <div class="video-container">
    <video id="bgVideo" src="video_404.mp4" autoplay loop muted playsinline webkit-playsinline preload="auto">
      <source src="video_404.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('bgVideo');
      if (video) {
        video.muted = true;
        
        // Forcer la lecture automatique compatible iOS/Safari/Chrome
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.warn("Lecture automatique en attente d'interaction :", error);
            // Relancer dès la première interaction
            document.body.addEventListener('click', () => video.play(), { once: true });
            document.body.addEventListener('touchstart', () => video.play(), { once: true });
          });
        }
      }
    });
  </script>

</body>
</html>
